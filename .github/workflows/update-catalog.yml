name: Update catalog

on:
  schedule:
    - cron: '0 16 * * *'   # daily ~ early morning New Zealand time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install yt-dlp
        run: pip install -U yt-dlp

      - name: Refresh nightly channels
        run: python update_nightly.py

      - name: Commit if the catalog changed
        run: |
          git config user.name "kidstv-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- catalog.json; then
            git add catalog.json
            git commit -m "Update catalog [skip ci]"
            git push
            echo "Catalog updated."
          else
            echo "No changes."
          fi
